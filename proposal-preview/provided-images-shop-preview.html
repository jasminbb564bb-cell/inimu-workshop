<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inimu SHOP / provided image preview</title>
  <style>
    :root { --paper:#f5f2ec; --ink:#262522; --muted:#777168; --line:#d7d1c7; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif; }
    main { width:min(1120px,calc(100% - 40px)); margin:auto; padding:64px 0 96px; }
    .eyebrow { margin:0 0 18px; color:var(--muted); font:11px Georgia,serif; letter-spacing:.2em; }
    h1 { margin:0; font-size:clamp(28px,4vw,48px); font-weight:400; letter-spacing:.12em; }
    .lead { max-width:38em; margin:22px 0 54px; color:var(--muted); font-size:12px; line-height:2; }
    figure { margin:0; }
    .provided-image { display:block; width:100%; height:auto; }
    .image-1 { max-width:720px; margin:0 auto; }
    .image-2 { width:100%; aspect-ratio:16/9; object-fit:cover; object-position:center; }
    figcaption { margin-top:12px; color:var(--muted); font-size:10px; letter-spacing:.08em; }
    .spatial { margin-top:92px; }
    .categories { display:grid; grid-template-columns:repeat(4,1fr); gap:0; margin-top:64px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .categories a { min-height:110px; padding:24px 16px; color:inherit; text-decoration:none; border-right:1px solid var(--line); }
    .categories a:last-child { border-right:0; }
    .number { display:block; color:var(--muted); font:11px Georgia,serif; letter-spacing:.12em; }
    .name { display:block; margin-top:12px; font-size:11px; letter-spacing:.08em; }
    .jp { display:block; margin-top:7px; color:var(--muted); font-size:10px; }
    .all { display:inline-block; margin-top:34px; padding-bottom:8px; border-bottom:1px solid var(--ink); color:inherit; text-decoration:none; font-size:11px; letter-spacing:.1em; }
    .note { margin-top:72px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:10px; line-height:1.8; }
    @media (max-width:680px) {
      main { width:calc(100% - 28px); padding-top:38px; }
      .lead { margin-bottom:34px; }
      .image-2 { aspect-ratio:1/1.08; }
      .spatial { margin-top:62px; }
      .categories { grid-template-columns:repeat(2,1fr); }
      .categories a:nth-child(2) { border-right:0; }
      .categories a:nth-child(-n+2) { border-bottom:1px solid var(--line); }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">INIMU / FIND BY ITEM</p>
    <h1>アイテムから探す</h1>
    <p class="lead">指定された2枚の画像を、そのままSHOPのビジュアルとして使用した確認用プレビューです。</p>

    <figure>
      <img class="provided-image image-1" src="assets/shop-reference-layout.png" alt="指定画像1：4カテゴリーのSHOPビジュアル">
      <figcaption>IMAGE 01 / 提供画像1 — 4カテゴリーの構成</figcaption>
    </figure>

    <figure class="spatial">
      <img class="provided-image image-2" src="assets/shop-intro-spatial-bottle.png" alt="指定画像2：庭の見える空間に置かれた香りのボトル">
      <figcaption>IMAGE 02 / 提供画像2 — SHOP導入ビジュアル</figcaption>
    </figure>

    <nav class="categories" aria-label="商品カテゴリー">
      <a href="../shop/?item=home-fragrance"><span class="number">01</span><span class="name">HOME FRAGRANCE</span><span class="jp">ホームフレグランス</span></a>
      <a href="../shop/?item=body-care"><span class="number">02</span><span class="name">BODY CARE</span><span class="jp">ボディケア</span></a>
      <a href="../shop/?item=fragrance"><span class="number">03</span><span class="name">FRAGRANCE</span><span class="jp">フレグランス</span></a>
      <a href="../shop/?item=gift-set"><span class="number">04</span><span class="name">GIFT SET</span><span class="jp">ギフトセット</span></a>
    </nav>
    <a class="all" href="../shop/?view=all#all-items">すべてのアイテムを見る →</a>
    <p class="note">比較用プレビューのみ。指定画像は元ファイルと同一内容でコピーして使用しています。本番SHOPは変更していません。</p>
  </main>
</body>
</html>
