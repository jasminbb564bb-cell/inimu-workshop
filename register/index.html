<!doctype html>
<html lang="ja">
<head><meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>REGISTER | inimu</title><link rel="stylesheet" href="../css/style.css"></head>
<body class="account-page" data-page="register">
<header class="site-header"><div class="site-header__inner"><a class="site-header__logo" href="../"><img src="../images/change1.png" alt="inimu"></a><nav class="site-nav"><button class="site-nav__toggle" type="button" aria-label="メニューを開く">☰</button><ul class="site-nav__list"><li><a href="../shop/">SHOP</a></li><li><a href="../experience/">EXPERIENCE</a></li><li><a href="../login/">LOGIN</a></li></ul></nav></div></header>
<main class="account-main"><section class="account-heading"><p class="section-label">REGISTER</p><h1>新規会員登録</h1><p>inimuを楽しむための会員情報を入力してください。</p></section>
<form class="account-form" data-form="register" novalidate><div class="form-grid"><label>氏名<input name="name" type="text"></label><label>フリガナ<input name="kana" type="text"></label><label>メールアドレス<input name="email" type="email"></label><label>電話番号<input name="phone" type="tel"></label><label>パスワード<input name="password" type="password"></label><label>パスワード確認<input name="passwordConfirm" type="password"></label><label>郵便番号<input name="postal" type="text"></label><label>住所<input name="address" type="text"></label></div>
<fieldset class="register-preference"><legend>あなたが香りを選ぶとき、<br>いちばん大切にしたいことは？</legend><div class="preference-options"><label class="purpose-option"><span class="purpose-option__text">落ち着きたい</span><input type="radio" name="purpose" value="落ち着きたい"><span class="purpose-option__radio" aria-hidden="true"></span></label><label class="purpose-option"><span class="purpose-option__text">気分を切り替えたい</span><input type="radio" name="purpose" value="気分を切り替えたい"><span class="purpose-option__radio" aria-hidden="true"></span></label><label class="purpose-option"><span class="purpose-option__text">自分らしさを感じたい</span><input type="radio" name="purpose" value="自分らしさを感じたい"><span class="purpose-option__radio" aria-hidden="true"></span></label><label class="purpose-option"><span class="purpose-option__text">記憶に残る香りがほしい</span><input type="radio" name="purpose" value="記憶に残る香りがほしい"><span class="purpose-option__radio" aria-hidden="true"></span></label><label class="purpose-option"><span class="purpose-option__text">贈りものにしたい</span><input type="radio" name="purpose" value="贈りものにしたい"><span class="purpose-option__radio" aria-hidden="true"></span></label><label class="purpose-option"><span class="purpose-option__text">まだわからない</span><input type="radio" name="purpose" value="まだわからない"><span class="purpose-option__radio" aria-hidden="true"></span></label></div></fieldset>
<label class="check-label"><input name="terms" type="checkbox"> 利用規約・プライバシーポリシーに同意する</label><p class="form-error" aria-live="polite"></p><button class="button" type="submit">登録内容を確認する</button></form></main>
<footer class="site-footer"><a class="site-footer__logo" href="../"><img src="../images/change1.png" alt="inimu"></a><p class="site-footer__copyright">© inimu</p></footer><script src="../js/main.js"></script>
<aside class="learning-note">本サイトは職業訓練の学習用に制作した架空のサンプルサイトです。<br>掲載している店舗・人物・連絡先・所在地はすべて架空であり、実在のものとは関係ありません。</aside></body></html>
