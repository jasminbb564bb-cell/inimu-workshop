<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>商品詳細 | inimu</title><link rel="stylesheet" href="../../css/style.css"><style>.product-detail{width:min(100% - 48px,1040px);margin:0 auto;padding:72px 0 120px}.product-detail__back{display:inline-block;margin-bottom:42px;color:inherit;text-decoration:none;border-bottom:1px solid #aaa59d;padding-bottom:8px}.product-detail__layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.8fr);gap:clamp(32px,7vw,96px);align-items:start}.product-detail__image{background:#f7f6f2}.product-detail__image img{display:block;width:100%;height:auto}.product-detail__copy{font-family:"Yu Gothic",YuGothic,"Noto Sans JP",sans-serif}.product-detail__brand{margin:0;color:#77736c;font-size:.76rem;letter-spacing:.12em}.product-detail__copy h1{margin:14px 0 30px;font-size:clamp(1.45rem,2.4vw,2.25rem);font-weight:500;line-height:1.5;letter-spacing:.08em;word-break:keep-all}.product-detail__meta{margin:0;border-top:1px solid #d8d4cc}.product-detail__meta div{display:flex;justify-content:space-between;gap:24px;padding:14px 0;border-bottom:1px solid #d8d4cc}.product-detail__meta dt{color:#77736c}.product-detail__meta dd{margin:0;text-align:right}.product-detail__unavailable{width:min(100% - 48px,760px);margin:0 auto;padding:72px 0 120px}@media(max-width:760px){.product-detail,.product-detail__unavailable{width:min(100% - 36px,1040px);padding:48px 0 80px}.product-detail__layout{grid-template-columns:1fr;gap:32px}.product-detail__copy h1{font-size:1.55rem;line-height:1.55}}</style></head><body class="shop-page"><header class="site-header"><div class="site-header__inner"><a class="site-header__logo" href="../../" aria-label="inimu トップ"><img src="../../images/change1.png" alt="inimu"></a><nav class="site-nav" aria-label="メインナビゲーション"><ul class="site-nav__list"><li><a href="../../shop/">SHOP</a></li><li><a href="../../experience/">EXPERIENCE</a></li></ul></nav></div></header><main id="product-detail-root"></main><script>
(()=>{const fallback={odoodoro:{name:'おどろおどろ',brand:'HATENKO / 破天荒',category:'フレグランス',size:'30ml',price:'13,750円',image:'../../images/products/hatenko-odoroodoro-editorial.png'},'perfume-brown':{name:'PERFUMERS EDT Brown Diamond',brand:'PERFUMERS',category:'フレグランス',price:'4,400円',image:'../../images/products/perfumers-brown-diamond-editorial.png'},hanabi:{name:'HATENKO Eau De Parfum 花火',brand:'HATENKO / 破天荒',category:'フレグランス',image:'../../images/products/hatenko-hanabi-editorial.png'},isonami:{name:'HATENKO Eau De Parfum 磯波',brand:'HATENKO / 破天荒',category:'フレグランス',size:'30ml',price:'13,750円',image:'../../images/products/hatenko-isonami-editorial.png'},'wanowa-hiba':{name:'WANOWA ルームスプレー 能登ひば',brand:'WANOWA',category:'ホームフレグランス',size:'60ml',price:'2,970円',image:'../../images/products/wanowa-noto-hiba-editorial.png'},fig:{name:'PERFUMERS ヘア＆ボディミスト フィグ',brand:'PERFUMERS',category:'ボディケア',size:'50ml',price:'1,760円',image:'../../images/products/perfumers-fig-editorial.png'},kou:{name:'kou 漢方生薬香',brand:'kou',category:'ホームフレグランス',price:'1,480円',image:'../../images/products/kou-kanpo-editorial.png'},'room-spray-hinoki':{name:'WANOWA ルームスプレー 加子母ひのき',brand:'WANOWA',category:'ホームフレグランス',size:'60ml',price:'2,970円',image:'../../images/products/wanowa-hinoki-editorial.png'},'aroma-brick':{name:'aroma recolte Aroma Brick',brand:'aroma recolte',category:'ホームフレグランス',price:'4,180円',image:'../../images/products/aroma-recolte-brick-editorial.png'},'discovery-set':{name:'HATENKO Discovery Set',brand:'HATENKO / 破天荒',category:'ギフトセット',price:'14,300円',image:'../../images/products/hatenko-discovery-editorial.png'}};const key=new URLSearchParams(location.search).get('product');const root=document.querySelector('#product-detail-root');const render=p=>{if(!p){root.innerHTML='<section class="product-detail__unavailable"><p class="section-label">PRODUCT DETAIL</p><h1>商品詳細は準備中です。</h1><a class="product-detail__back" href="../../shop/">商品一覧へ戻る →</a></section>';return}document.title=`${p.name} | inimu`;root.innerHTML=`<section class="product-detail"><a class="product-detail__back" href="../../shop/">← 商品一覧へ戻る</a><div class="product-detail__layout"><div class="product-detail__image"><img src="${p.image.startsWith('http')?p.image:'../../'+p.image.replace(/^\.\.\//,'')}" alt="${p.name}"></div><div class="product-detail__copy"><p class="product-detail__brand">${p.brand}</p><h1>${p.name}</h1><dl class="product-detail__meta"><div><dt>カテゴリー</dt><dd>${p.category}</dd></div>${p.size?`<div><dt>容量</dt><dd>${p.size}</dd></div>`:''}${p.price?`<div><dt>価格</dt><dd>${p.price}</dd></div>`:''}</dl></div></div></section>`};render(fallback[key]);fetch(`../../api/products/${encodeURIComponent(key)}`).then(r=>r.ok?r.json():Promise.reject()).then(p=>{p.image=p.image||fallback[key]?.image;render(p)}).catch(()=>{});})();
</script></main></body></html>
