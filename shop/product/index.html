<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow"><title>商品詳細 | inimu</title><link rel="stylesheet" href="../../css/style.css"><style>
.product-detail{width:min(100% - 48px,1040px);margin:0 auto;padding:72px 0 120px}.product-detail__back{display:inline-block;margin-bottom:42px;color:inherit;text-decoration:none;border-bottom:1px solid #aaa59d;padding-bottom:8px}.product-detail__layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.8fr);gap:clamp(32px,7vw,96px);align-items:start}.product-detail__image{background:#f7f6f2}.product-detail__image img{display:block;width:100%;height:auto}.product-detail__copy h1{margin:12px 0 24px;font-size:clamp(1.8rem,4vw,3.2rem);font-weight:400;line-height:1.45}.product-detail__meta{margin:0;border-top:1px solid #d8d4cc}.product-detail__meta div{display:flex;justify-content:space-between;gap:24px;padding:14px 0;border-bottom:1px solid #d8d4cc}.product-detail__meta dt{color:#77736c}.product-detail__meta dd{margin:0;text-align:right}.product-detail__note{margin-top:28px;color:#77736c;line-height:1.9}.product-detail__unavailable{width:min(100% - 48px,760px);margin:0 auto;padding:72px 0 120px}@media(max-width:760px){.product-detail,.product-detail__unavailable{width:min(100% - 36px,1040px);padding:48px 0 80px}.product-detail__layout{grid-template-columns:1fr;gap:32px}.product-detail__copy h1{font-size:2rem}}
</style></head>
<body class="shop-page"><header class="site-header"><div class="site-header__inner"><a class="site-header__logo" href="../../" aria-label="inimu トップ"><img src="../../images/change1.png" alt="inimu"></a><nav class="site-nav" aria-label="メインナビゲーション"><ul class="site-nav__list"><li><a href="../../shop/">SHOP</a></li><li><a href="../../experience/">EXPERIENCE</a></li></ul></nav></div></header><main id="product-detail-root"></main>
<script>(()=>{const products={odoodoro:{name:'HATENKO おどろおどろ',brand:'HATENKO / 破天荒',category:'フレグランス',size:'30ml',price:'13,750円',image:'../../images/products/hatenko-odoroodoro-editorial.webp',alt:'HATENKO おどろおどろ'}};const product=products[new URLSearchParams(location.search).get('product')];const root=document.querySelector('#product-detail-root');if(!product){root.innerHTML='<section class="product-detail__unavailable"><p class="section-label">PRODUCT DETAIL</p><h1>商品詳細は準備中です。</h1><p>この商品の詳細情報は、公式情報を確認したうえで掲載します。</p><a class="product-detail__back" href="../../shop/">商品一覧へ戻る →</a></section>';return}document.title=`${product.name} | inimu`;root.innerHTML=`<section class="product-detail"><a class="product-detail__back" href="../../shop/">← 商品一覧へ戻る</a><div class="product-detail__layout"><div class="product-detail__image"><img src="${product.image}" alt="${product.alt}"></div><div class="product-detail__copy"><p class="section-label">${product.brand}</p><h1>${product.name}</h1><dl class="product-detail__meta"><div><dt>カテゴリー</dt><dd>${product.category}</dd></div><div><dt>容量</dt><dd>${product.size}</dd></div><div><dt>価格</dt><dd>${product.price}</dd></div></dl><p class="product-detail__note">商品説明・購入方法は、公式情報を確認できた内容のみ掲載します。</p></div></div></section>`})()</script></body></html>
