<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inimu — Scene 03</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18140f}
    body{display:grid;place-items:center}
    .frame{position:relative;width:100vw;height:100vh;overflow:hidden;background:#18140f}
    img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;animation:quiet-dolly 6s ease-in-out both;transform-origin:52% 52%}
    @keyframes quiet-dolly{0%{transform:scale(1.005) translate3d(0,0,0)}55%{transform:scale(1.025) translate3d(-.15%,0,0)}100%{transform:scale(1.045) translate3d(-.3%,-.1%,0)}}
    @media(prefers-reduced-motion:reduce){img{animation:none}}
  </style>
</head>
<body><main class="frame"><img src="images/scene-03-perfume-room-final.png" alt="香水が一本だけ置かれた日本建築"></main></body>
</html>
