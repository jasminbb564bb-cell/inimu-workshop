<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inimu — Scene 04</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11110f}
    body{display:grid;place-items:center}
    .frame{width:100vw;height:100vh;overflow:hidden;background:#11110f}
    img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;transform-origin:55% 49%;animation:atelier-dolly 12s linear forwards}
    @keyframes atelier-dolly{
      0%{transform:scale(1) translate3d(0,0,0)}
      100%{transform:scale(2) translate3d(-.95%,-.65%,0)}
    }
    @media(prefers-reduced-motion:reduce){img{animation:none;transform:scale(1.005)}}
    /* 前回の大胆な試作: 8s / cubic-bezier / 中間scale 1.5 は廃止 */
  </style>
</head>
<body>
  <main class="frame">
    <img src="images/scene-04-atelier-final.webp" alt="襖の向こうにある調香の間">
  </main>
</body>
</html>
